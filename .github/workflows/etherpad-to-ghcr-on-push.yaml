---
name: Etherpad Docker Image on Push to GHCR

on:
  push:
    branches-ignore:
      - master

jobs:
  build_image_on_push:
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    uses: hpi-schul-cloud/infra-tools/.github/workflows/imagetoghcr-on-push.yaml@9427df6b6015b8f6dc3b0c1142ffe35dfd4b1e0f # main
    with:
      image_name: "etherpad"
